spring:
  application:
    name: ledgerline
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${LEDGER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ledger:
  admin-token: ${LEDGER_ADMIN_TOKEN:change-me}
  projection:
    enabled: true
    batch-size: 500
    poll-interval-ms: 500
